<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123b2b" />
    <title>Mtaa-Services Admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" class="shell">
      <section class="login-panel">
        <div class="brand-mark">RF</div>
        <p class="eyebrow">PLATFORM ADMINISTRATION</p>
        <h1>Mtaa-Services Admin</h1>
        <p class="muted">Sign in with an active admin or super-admin account.</p>
        <form id="login-form">
          <label>Supabase project URL<input name="url" type="url" placeholder="https://your-project.supabase.co" required /></label>
          <label>Supabase anon key<input name="key" type="password" autocomplete="off" required /></label>
          <label>Email<input name="email" type="email" autocomplete="username" required /></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
          <button class="primary">Sign in</button>
        </form>
        <p id="login-error" class="error" role="alert"></p>
        <p class="security-note">All reads and changes are checked by Supabase authorization. This page never uses a service-role key.</p>
      </section>
      <section id="dashboard" hidden>
        <header class="topbar"><div><p class="eyebrow">MTAA SERVICES</p><h1>RuiruFix Admin</h1></div><div class="account"><span id="admin-email"></span><button id="sign-out" class="quiet">Sign out</button></div></header>
        <nav id="tabs" class="tabs" aria-label="Admin sections"></nav>
        <section id="content" aria-live="polite"></section>
        <p id="app-error" class="error"></p>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
